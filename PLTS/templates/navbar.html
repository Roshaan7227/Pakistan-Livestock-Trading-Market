{% load static %}
<header class="navbar">
    <a href="{% url 'home' %}" class="logo">
        <img src="{% static 'images/logo.jpg' %}" alt="Pakistan Livestock Logo" class="logo-img">
        Pak<span>Livestock</span>
    </a>
    <nav>
        <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
        <a href="{% url 'livestock' %}" class="{% if request.resolver_match.url_name == 'livestock' %}active{% endif %}">Livestock</a>
        <a href="{% url 'search_livestock' %}" class="{% if request.resolver_match.url_name == 'search_livestock' %}active{% endif %}">Search Animal</a>
        <a href="{% url 'blog' %}" class="{% if request.resolver_match.url_name == 'blog' %}active{% endif %}">Blog</a>

        {% if user.is_authenticated %}
            <a href="{% url 'favorite_list' %}" class="{% if request.resolver_match.url_name == 'favorite_list' or request.resolver_match.url_name == 'myfavorites' %}active{% endif %}">Favorites</a>
            <a href="{% url 'add_livestock' %}" class="{% if request.resolver_match.url_name == 'add_livestock' %}active{% endif %}">Add Livestock</a>
            <a href="{% url 'contact' %}" class="contact-btn {% if request.resolver_match.url_name == 'contact' %}active{% endif %}">Contact Us</a>
            <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="login-btn {% if request.resolver_match.url_name == 'login' %}active{% endif %}">Login</a>
        {% endif %}
    </nav>
</header>
